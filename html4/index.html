<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale= 1">
<link rel="icon" type="image/jpg" href="ado new genesis.jpg">
<title> html4 </title>

<body>

    <!-- Tables! -->
<h3> Store Hours </h3>

<!-- You can add attributes inside the table tags-->

<table style="background-color:tomato;" border="2">
    <tr> <!-- Tr stands for table row-->
        <th width="100" style="background-color:aquamarine;"> Sunday </th> 
        <th width="100" style="background-color:aquamarine;"> Monday </th> 
        <th width="100" style="background-color:aquamarine;"> Tuesday </th> 
        <th width="100"style="background-color:aquamarine;"> Wednesday </th> <!-- Th stands for table header-->
        <th width="100"style="background-color:aquamarine;"> Thursday </th> 
        <th width="100" style="background-color:aquamarine;"> Friday </th> 
        <th width="100" style="background-color:aquamarine;"> Saturday </th> 
    </tr> <!-- Add another tr for another row-->
    <tr align="center" >
        <td> Closed </td>
        <td> 8-6 </td>
        <td> 8-6  </td>
        <td> 8-6  </td>
        <td> 8-6  </td> <!-- Td stands for table data -->
        <td> 8-6  </td>
        <td> Closed </td>
    </tr>

<!-- You may use align="right" if you want a right justified words-->
<!-- background colors, alignment can be used directly inside the <tr>-->

</table>

</body>

</head>
</html>
